[workspace]
resolver = "2"
members = [
    "core/packet-engine",
    "core/protocol-parsers",
    "core/flow-tracker",
    "core/dns",
    "core/profile-engine",
    "core/diagnostics",
    "core/compatibility",
    "core/ipc-protocol",
    "service/windows-service",
    "tools/zondpi-cli",
    "engines/goodbye",
    "engines/byedpi",
    "app/gui/src-tauri",
]

[workspace.package]
version = "1.0.5"
edition = "2021"
authors = ["ZonDPI Contributors"]
license = "Apache-2.0"
repository = "https://github.com/zondpi/zondpi"

[workspace.dependencies]
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
windows = "0.58"
windows-sys = "0.59"
windows-service = "0.8.1"
clap = { version = "4.5", features = ["derive"] }
interprocess = { version = "2.2", features = ["tokio"] }
zondpi-ipc-protocol = { path = "core/ipc-protocol" }
zondpi-packet-engine = { path = "core/packet-engine" }
zondpi-profile-engine = { path = "core/profile-engine" }
zondpi-compatibility = { path = "core/compatibility" }
zondpi-dns = { path = "core/dns" }
zondpi-diagnostics = { path = "core/diagnostics" }
zondpi-protocol-parsers = { path = "core/protocol-parsers" }
zondpi-flow-tracker = { path = "core/flow-tracker" }
zondpi-engine-goodbye = { path = "engines/goodbye" }
zondpi-engine-byedpi = { path = "engines/byedpi" }
