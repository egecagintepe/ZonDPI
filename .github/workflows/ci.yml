name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  check-and-test:
    name: Windows x64 Build, Test & Lint
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust Toolchain (Stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install MinGW-w64 & GNU Make
        shell: pwsh
        run: |
          choco install make mingw -y --no-progress
          "C:\tools\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "C:\ProgramData\chocolatey\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify Toolchain
        shell: pwsh
        run: |
          rustc --version
          cargo --version
          gcc --version
          make --version

      - name: Verify Driver Hashes
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File third_party/windivert/verify_driver.ps1

      - name: Check Rust Formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy Linter
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Rust Workspace Tests
        run: cargo test --workspace

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'app/gui/package-lock.json'

      - name: Build and Lint GUI Frontend
        run: |
          cd app/gui
          npm ci
          npm run typecheck
          npm run lint
          npm run build
          cd ../..

      - name: Run Master Build Pipeline (build.ps1)
        shell: pwsh
        run: |
          pwsh -ExecutionPolicy Bypass -File build.ps1 -Configuration Release

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zondpi-build-artifacts
          path: |
            dist/
            release/
          retention-days: 14
