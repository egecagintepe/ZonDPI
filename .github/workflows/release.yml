name: Release Packaging

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.5)'
        required: true
        type: string

jobs:
  package-release:
    name: Build & Package Windows Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain (Stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install MinGW-w64 & GNU Make
        shell: pwsh
        run: |
          choco install make mingw nsis -y --no-progress
          "C:\tools\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "C:\ProgramData\chocolatey\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify Driver Hashes
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File third_party/windivert/verify_driver.ps1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'app/gui/package-lock.json'

      - name: Build GUI Frontend
        run: |
          cd app/gui
          npm ci
          npm run build
          cd ../..

      - name: Run Master Build Pipeline (build.ps1)
        shell: pwsh
        run: |
          pwsh -ExecutionPolicy Bypass -File build.ps1 -Configuration Release

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zondpi-release-${{ inputs.version }}
          path: release/
          retention-days: 30
